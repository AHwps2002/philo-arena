<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>哲学竞技场 · 名字决定结局</title>
  <meta name="description" content="输入几个名字，看他们在淘汰赛里用哲学招式互相拆解。名字决定属性，也决定结局；同样的名字永远打出同样的结果。" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="masthead">
      <p class="kicker">PHILOSOPHY ARENA</p>
      <h1>哲学竞技场</h1>
      <p class="lede">
        把几位哲学家请进同一座竞技场，让他们的观点短兵相接。
        你只负责点名，怎么打是他们的事。
      </p>
    </header>

    <main class="layout">
      <aside class="panel controls">
        <div class="label-row">
          <label class="label" for="names">参赛者</label>
          <span class="count" id="count">4 位</span>
        </div>

        <textarea id="names" class="names" rows="8" spellcheck="false"
                  placeholder="每行一个名字&#10;苏格拉底&#10;柏拉图"></textarea>

        <div class="presets" role="group" aria-label="预设名单">
          <button type="button" class="chip" data-preset="ancient">古希腊</button>
          <button type="button" class="chip" data-preset="german">德国观念论</button>
          <button type="button" class="chip" data-preset="exist">存在主义</button>
          <button type="button" class="chip" data-preset="analytic">分析哲学</button>
          <button type="button" class="chip" data-preset="random">随机八人</button>
        </div>

        <p class="hint">每行一个名字，2 到 16 位。<br />想加谁就加谁。</p>

        <button type="button" class="btn-primary" id="start">开始辩论</button>
        <p class="error" id="error" role="alert"></p>

        <div class="speed" id="speed" hidden>
          <span class="speed-label">速度</span>
          <button type="button" data-speed="1.7">慢</button>
          <button type="button" data-speed="1" class="on">正常</button>
          <button type="button" data-speed="0.45">快</button>
          <button type="button" data-skip="1">跳过</button>
        </div>
      </aside>

      <section class="stage">
        <div class="stage-head">
          <h2 id="stage-title">赛程</h2>
          <span class="seed" id="seed" hidden></span>
        </div>

        <div class="bracket" id="bracket" aria-label="淘汰赛对阵图"></div>

        <div class="champion" id="champion" hidden></div>

        <div class="log-head">
          <h2>战报</h2>
          <span class="log-hint">自动播放，无需操作</span>
        </div>
        <div class="log" id="log" role="log" aria-live="polite" aria-label="对战记录"></div>
      </section>
    </main>

    <footer class="foot">
      <p>胜负是游戏的事。他们真正争论过的东西，比这难判得多。</p>
    </footer>
  </div>


  <div class="card-modal" id="card-modal" hidden>
    <div class="card-backdrop" data-close></div>
    <div class="card-panel" role="dialog" aria-modal="true" aria-labelledby="card-name">
      <button class="card-close" type="button" aria-label="关闭" data-close>×</button>
      <div class="card-portrait" id="card-portrait"></div>
      <div class="card-content">
        <p class="card-school" id="card-school"></p>
        <h3 class="card-name" id="card-name"></h3>
        <p class="card-eval" id="card-eval"></p>
        <div class="card-stats" id="card-stats"></div>
        <p class="card-line" id="card-sig"></p>
        <p class="card-line" id="card-trait"></p>
        <p class="card-quote" id="card-quote"></p>
      </div>
    </div>
  </div>
  <script src="engine.js"></script>
  <script src="avatars.js"></script>
  <script src="game.js"></script>
</body>
</html>
